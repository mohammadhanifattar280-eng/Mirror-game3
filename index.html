<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>مسیر آینه ۲.۰</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
body{font-family:Tahoma,sans-serif;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;height:100dvh;overflow:hidden;position:fixed;width:100%;top:0;left:0}
#game-area{position:relative;width:100%;max-width:500px;height:100%;max-height:100dvh;background:#1a1a2e;overflow:hidden;transition:background-color .6s;box-shadow:0 0 20px rgba(0,0,0,.8);display:flex;flex-direction:column}
@media (min-width: 600px){#game-area{border-radius:20px;max-height:850px;margin:auto}}
.top-btn{position:absolute;top:15px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 14px;border-radius:20px;font-size:16px;cursor:pointer;z-index:100;display:none}
#pause-btn{right:15px}#home-btn{right:125px}#sound-btn{right:75px}
.top-btn.show{display:block}
#top-hud{position:absolute;top:70px;width:100%;display:flex;justify-content:center;gap:15px;z-index:5;font-weight:bold;text-shadow:0 2px 5px #000;padding:0 10px}
#score-display{font-size:20px;color:#00e5ff}
#stage-display{font-size:15px;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:15px;color:#fdd835;direction:ltr}
#powerup-status{position:absolute;top:115px;width:100%;display:flex;justify-content:center;gap:10px;z-index:5;font-size:14px;font-weight:bold;pointer-events:none;flex-wrap:wrap;padding:0 10px}
.status-item{background:rgba(0,0,0,.6);padding:5px 10px;border-radius:10px;border:1px solid #fff}
#player{position:absolute;bottom:10%;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 0 20px #00e5ff,0 0 40px #00e5ff;z-index:4;transform:translateX(-50%);transition:box-shadow .3s}
#player.shielded{box-shadow:0 0 30px #2196f3,0 0 60px #2196f3;border:2px solid #2196f3}
#player.magnetized{box-shadow:0 0 30px #fdd835,0 0 60px #fdd835;border:2px solid #fdd835}
.obstacle{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center}
.shape-circle{width:45px;height:45px;border-radius:50%}
.shape-square{width:40px;height:40px;border-radius:8px}
.shape-rect{width:80px;height:20px;border-radius:10px}
.shape-diamond{width:35px;height:35px;border-radius:5px}
.shape-oval{width:90px;height:25px;border-radius:50%}
.powerup{width:45px;height:45px;border-radius:50%;animation:powerPulse .5s infinite alternate;font-size:24px}
@keyframes powerPulse{from{transform:scale(1)}to{transform:scale(1.2)}}
#touch-zone{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(15,15,26,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:20px;text-align:center;overflow-y:auto}
.screen h1{font-size:clamp(24px,6vw,32px);color:#00e5ff;margin-bottom:15px}
.screen p{font-size:clamp(13px,3.5vw,15px);line-height:1.8;margin-bottom:20px;color:#ccc}
.btn{padding:14px 45px;font-size:clamp(16px,4vw,18px);font-weight:bold;border:none;border-radius:50px;background:linear-gradient(135deg,#00e5ff,#ff5252);color:#111;cursor:pointer;box-shadow:0 5px 15px rgba(0,229,255,.3);margin:5px;transition:transform .1s}
.btn:active{transform:scale(.95)}
.btn-lang{padding:8px 20px;font-size:14px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;box-shadow:none;margin:5px 10px}
.btn-lang.active{background:#00e5ff;color:#111;border-color:#00e5ff;box-shadow:0 0 10px #00e5ff}
.hidden{display:none!important}
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:#fdd835;color:#000;padding:15px 30px;border-radius:10px;font-weight:bold;z-index:999;transition:.3s;pointer-events:none;text-align:center;font-size:clamp(14px,3.5vw,16px)}
#toast.show{transform:translate(-50%,-50%) scale(1)}
#level-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:80;opacity:0;pointer-events:none;transition:opacity .5s ease-in-out}
#level-overlay.show{opacity:1}
#level-overlay h2{font-size:clamp(40px,10vw,60px);color:#00e5ff;text-shadow:0 0 20px #00e5ff;margin-bottom:10px;transform:scale(0.5);transition:transform .5s cubic-bezier(0.175,0.885,0.32,1.275)}
#level-overlay.show h2{transform:scale(1)}
#level-overlay p{font-size:clamp(16px,4vw,20px);color:#fff;font-weight:bold}
.level-buttons{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn-level{padding:12px 22px;font-size:clamp(14px,3.5vw,16px);background:#333;color:#fff;border:2px solid #00e5ff;border-radius:12px;cursor:pointer;font-weight:bold;margin:5px}
.btn-level:active{transform:scale(0.95)}
.level-menu-btn{background:#2196f3;box-shadow:0 5px 15px rgba(33,150,243,.4)}
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:15px;max-height:60vh;overflow-y:auto;padding:10px;width:100%}
.level-btn-item{padding:12px 0;font-size:clamp(13px,3.5vw,16px);font-weight:bold;border-radius:10px;background:#333;color:#fff;border:2px solid #555;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:5px}
.level-btn-item.unlocked{border-color:#00e5ff;background:rgba(0,229,255,.1)}
.level-btn-item.unlocked:active{background:rgba(0,229,255,.3)}
.level-btn-item.locked{opacity:.5;cursor:not-allowed;color:#888;border-color:#333}
</style>
</head>
<body>
<div id="game-area">
<button id="sound-btn" class="top-btn" onclick="toggleSound()">🔊</button>
<button id="pause-btn" class="top-btn" onclick="togglePause()">⏸</button>
<button id="home-btn" class="top-btn" onclick="goHome()">🏠</button>
<div id="top-hud"><div id="score-display"><span id="score-lbl">امتیاز</span>: <span id="score">0</span></div><div id="stage-display">Level 1 | مرحله 1</div></div>
<div id="powerup-status"></div><div id="toast"></div>
<div id="touch-zone"></div><div id="player"></div>
<div id="level-overlay"><h2 id="level-title">Level 2</h2><p id="level-subtitle">آماده باش!</p></div>
<div id="device-screen" class="screen"><h1 style="color:#00e5ff">انتخاب دستگاه</h1><p style="color:#ccc;margin-bottom:30px;">با چه دستگاهی می‌خوای بازی کنی؟</p><button class="btn" style="background:#2196f3;width:80%;max-width:300px;margin-bottom:15px;font-size:20px;" onclick="selectDevice('pc')">💻 کامپیوتر</button><button class="btn" style="background:#4caf50;width:80%;max-width:300px;font-size:20px;" onclick="selectDevice('mobile')">📱 موبایل</button></div>
<div id="start-screen" class="screen hidden"><h1 id="title-txt">مسیر آینه ۲.۰</h1><p id="desc-txt"></p><div style="color:#fdd835;font-weight:bold;margin-bottom:10px;">🏆 <span id="best-lbl">رکورد</span>: <span id="best-score">0</span></div><button class="btn" onclick="startGame(1)">شروع بازی</button><button class="btn level-menu-btn" onclick="openLevelsMenu()">Levels</button><div style="margin-top:40px;display:flex;justify-content:center;"><button class="btn btn-lang active" id="lang-fa" onclick="setLang('fa')">فارسی</button><button class="btn btn-lang" id="lang-en" onclick="setLang('en')">English</button></div></div>
<div id="levels-screen" class="screen hidden"><h1 id="level-menu-title" style="color:#00e5ff">Level</h1><p id="level-menu-desc">Levelهایی که باز کردی انتخاب کن</p><div id="levels-grid" class="level-grid"></div><button class="btn" style="margin-top:15px;background:none;box-shadow:none;color:#aaa;" onclick="closeLevelsMenu()">بازگشت</button></div>
<div id="end-screen" class="screen hidden"><h1 id="end-title" style="color:#ff5252">باختی!</h1><p><span id="final-lbl">امتیاز شما:</span> <b id="final-score" style="font-size:32px;color:#00e5ff">0</b></p><div class="level-buttons"><button class="btn-level" onclick="startGame(1)">Level 1</button><button class="btn-level" id="lose-btn-lvl2" onclick="startGame(2)">Level 2</button></div><button class="btn" style="background:none;box-shadow:none;color:#aaa;font-size:14px;margin-top:20px" onclick="goHome()">منوی اصلی</button></div>
<div id="win-screen" class="screen hidden"><h1 id="win-title" style="color:#4caf50">🎉 بردی!</h1><p id="win-sub">وارد Level جدید شدی!</p><div class="level-buttons"><button class="btn-level" onclick="startGame(1)">Level 1</button><button class="btn-level" onclick="startGame(2)">Level 2</button></div><button class="btn" style="background:none;box-shadow:none;color:#aaa;font-size:14px;margin-top:20px" onclick="goHome()">منوی اصلی</button></div>
</div>
<script>
const gameArea=document.getElementById('game-area'),player=document.getElementById('player'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('powerup-status'),toastEl=document.getElementById('toast'),deviceScreen=document.getElementById('device-screen'),startScreen=document.getElementById('start-screen'),endScreen=document.getElementById('end-screen'),winScreen=document.getElementById('win-screen'),levelsScreen=document.getElementById('levels-screen'),pauseBtn=document.getElementById('pause-btn'),soundBtn=document.getElementById('sound-btn'),homeBtn=document.getElementById('home-btn'),stageDisplay=document.getElementById('stage-display'),levelOverlay=document.getElementById('level-overlay');

let state={isPlaying:false,isPaused:false,score:0,level:0,speedLevel:0,currentLevelNum:1,maxLevel:parseInt(localStorage.getItem('mirrorPath_maxLevel')||'1'),playerX:200,targetX:200,isTouching:false,touchStartX:0,gameSpeed:4.5,spawnTimer:0,lastTime:0,obstacles:[],animationId:null,scoreInterval:null,soundOn:true,bestScore:parseInt(localStorage.getItem('mirrorPath_bestScore')||'0'),shields:0,magnetTimer:0,slowTimer:0,lang:'fa',device:'mobile'};

const langData={
fa:{title:'مسیر آینه ۲.۰',desc:'توپ رو با کشیدن انگشت جابه‌جا کن.<br>⚠️ <b>کنترل‌ها برعکسن!</b><br><br><b>دایره‌ها:</b> باید بزنی!<br><b>بقیه:</b> جاخالی بده!<br><br><span style="color:#2196f3">🛡 سپر:</span> یک جان اضافه<br><span style="color:#4caf50">🐢 کندی:</span> ۵ ثانیه آروم میشه<br><span style="color:#fdd835">✨ آهنربا:</span> جذب دایره‌ها (۱۰ ثانیه)<br><span style="color:#ff5252">💥 بمب:</span> نابودی موانع بد',scoreLbl:'امتیاز',bestLbl:'رکورد',stage:'مرحله',lvl:'Level',endTitle:'باختی!',winTitle:'🎉 بردی!',finalLbl:'امتیاز شما:',shieldBroken:'🛡 یک سپر از دست دادی!',shieldActive:'🛡 سپر گرفتی!',slowActive:'🐢 زمان کند شد!',magnetActive:'✨ آهنربا فعال شد!',bomb:'💥 انفجار!',newRecord:'🎉 رکورد جدید!',levelUp:'آماده باش!',winSub:'وارد Level جدید شدی!',levelMenuTitle:'Level',levelMenuDesc:'Levelهایی که باز کردی انتخاب کن',backBtn:'بازگشت'},
en:{title:'Mirror Path 2.0',desc:'Move the ball by swiping.<br>⚠️ <b>Controls are reversed!</b><br><br><b>Circles:</b> Hit them!<br><b>Others:</b> Avoid them!<br><br><span style="color:#2196f3">🛡 Shield:</span> Extra life<br><span style="color:#4caf50">🐢 Slow:</span> 5s slow down<br><span style="color:#fdd835">✨ Magnet:</span> Attract circles (10s)<br><span style="color:#ff5252">💥 Bomb:</span> Destroy bad obstacles',scoreLbl:'Score',bestLbl:'Best',stage:'Stage',lvl:'Level',endTitle:'Game Over!',winTitle:'🎉 You Won!',finalLbl:'Your Score:',shieldBroken:'🛡 You lost a shield!',shieldActive:'🛡 Shield Gained!',slowActive:'🐢 Time Slowed!',magnetActive:'✨ Magnet Active!',bomb:'💥 Explosion!',newRecord:'🎉 New Record!',levelUp:'Get Ready!',winSub:'You reached a new Level!',levelMenuTitle:'Level',levelMenuDesc:'Choose an unlocked level',backBtn:'Back'}
};

function selectDevice(dev) {
    state.device = dev;deviceScreen.classList.add('hidden');startScreen.classList.remove('hidden');
    if (dev === 'pc') {gameArea.style.maxWidth = '500px'; gameArea.style.maxHeight = '850px'; gameArea.style.height = '90vh'; gameArea.style.borderRadius = '20px';}
    else {gameArea.style.maxWidth = '100%'; gameArea.style.maxHeight = '100dvh'; gameArea.style.height = '100%'; gameArea.style.borderRadius = '0';}
}
function setLang(l){
state.lang=l;document.documentElement.dir=l==='fa'?'rtl':'ltr';const d=langData[l];
document.getElementById('title-txt').innerHTML=d.title;document.getElementById('desc-txt').innerHTML=d.desc;document.getElementById('score-lbl').innerHTML=d.scoreLbl;document.getElementById('best-lbl').innerHTML=d.bestLbl;document.getElementById('end-title').innerHTML=d.endTitle;document.getElementById('win-title').innerHTML=d.winTitle;document.getElementById('win-sub').innerHTML=d.winSub;document.getElementById('final-lbl').innerHTML=d.finalLbl;document.getElementById('level-menu-title').innerHTML=d.levelMenuTitle;document.getElementById('level-menu-desc').innerHTML=d.levelMenuDesc;document.getElementById('levels-screen').querySelectorAll('.btn')[0].innerHTML=d.backBtn;
document.getElementById('lang-fa').classList.toggle('active', l==='fa');document.getElementById('lang-en').classList.toggle('active', l==='en');
}
function goHome(){
state.isPlaying=false;cancelAnimationFrame(state.animationId);clearInterval(state.scoreInterval);state.obstacles.forEach(o=>o.el.remove());state.obstacles=[];
pauseBtn.classList.remove('show');soundBtn.classList.remove('show');homeBtn.classList.remove('show');levelOverlay.classList.remove('show');
startScreen.classList.remove('hidden');endScreen.classList.add('hidden');winScreen.classList.add('hidden');levelsScreen.classList.add('hidden');setLang(state.lang);
}
function openLevelsMenu() {
    startScreen.classList.add('hidden');levelsScreen.classList.remove('hidden');const grid = document.getElementById('levels-grid');grid.innerHTML = '';
    for (let i = 1; i <= 200; i++) {
        const btn = document.createElement('button');btn.className = 'level-btn-item';
        if (i <= state.maxLevel) {btn.classList.add('unlocked');btn.innerHTML = `Level ${i}`;let levelNum = i;btn.onclick = () => { closeLevelsMenu(); startGame(levelNum); };}
        else {btn.classList.add('locked');btn.innerHTML = `Level ${i} 🔒`;btn.onclick = () => { showToast('این Level قفله! اول Levelهای قبلی رو ببر.'); };}
        grid.appendChild(btn);
    }
}
function closeLevelsMenu() {levelsScreen.classList.add('hidden');startScreen.classList.remove('hidden');}
const AudioContext=window.AudioContext||window.webkitAudioContext;let audioCtx;
function playSound(t){
if(!state.soundOn)return;if(!audioCtx)audioCtx=new AudioContext();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);const n=audioCtx.currentTime;
if(t==='hit'){o.type='sine';o.frequency.setValueAtTime(880,n);o.frequency.exponentialRampToValueAtTime(1320,n+.1);g.gain.setValueAtTime(.5,n);g.gain.exponentialRampToValueAtTime(.01,n+.1);o.start(n);o.stop(n+.1)}
else if(t==='bad'){o.type='square';o.frequency.setValueAtTime(150,n);g.gain.setValueAtTime(.5,n);g.gain.exponentialRampToValueAtTime(.01,n+.3);o.start(n);o.stop(n+.3)}
else{o.type='triangle';o.frequency.setValueAtTime(400,n);o.frequency.exponentialRampToValueAtTime(1000,n+.2);g.gain.setValueAtTime(.5,n);g.gain.exponentialRampToValueAtTime(.01,n+.2);o.start(n);o.stop(n+.2)}
}
function showToast(m){toastEl.textContent=m;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1500)}
function updatePowerupUI(){
comboEl.innerHTML='';
if(state.shields > 0) comboEl.innerHTML+=`<div class="status-item" style="color:#2196f3">🛡 x${state.shields}</div>`;
if(state.slowTimer>0)comboEl.innerHTML+=`<div class="status-item" style="color:#4caf50">🐢 ${Math.ceil(state.slowTimer/1000)}s</div>`;
if(state.magnetTimer>0)comboEl.innerHTML+=`<div class="status-item" style="color:#fdd835">✨ ${Math.ceil(state.magnetTimer/1000)}s</div>`;
}
function spawnObstacle(){
const el=document.createElement('div');el.className='obstacle';const currentLvlNum = Math.floor(state.score / 1000) + 1;const isLevelOne = currentLvlNum === 1;const puChance = isLevelOne ? 0.18 : 0.08;const isPU=Math.random()<puChance;let isHit=false,isMoving=false,moveDir=1,moveSpeed=0;
if(isPU){let ps = ['🛡','🐢','✨','💥'];if (isLevelOne) ps = ['🛡', '🛡', '🛡', '🐢', '✨', '💥'];const p=ps[Math.floor(Math.random()*ps.length)];el.classList.add('powerup');el.textContent=p;el.dataset.power=p;el.style.background='rgba(255,255,255,.2)';el.style.boxShadow='0 0 15px #fff';}
else{const shapes=['shape-circle','shape-square','shape-rect','shape-diamond','shape-oval'];const mc=currentLvlNum>=1?.35:0;isMoving=Math.random()<mc;let shape;if(isMoving){const bs=['shape-square','shape-rect','shape-diamond','shape-oval'];shape=bs[Math.floor(Math.random()*bs.length)]}else shape=shapes[Math.floor(Math.random()*shapes.length)];el.classList.add(shape);const cs=['#ff5252','#ff9800','#e91e63','#3f51b5','#00bcd4','#009688','#4caf50'],c=cs[Math.floor(Math.random()*cs.length)];el.style.background=c;
if(isMoving){el.style.boxShadow=`0 0 15px ${c},0 0 25px ${c}`;el.style.border='2px dashed rgba(255,255,255,.6)';moveDir=Math.random()<.5?1:-1;moveSpeed=1.5;} else el.style.boxShadow=`0 0 15px ${c}`;isHit=(shape==='shape-circle');}
const obsX=Math.random()*(gameArea.clientWidth-50);el.style.left=obsX+'px';el.style.top='-50px';gameArea.appendChild(el);state.obstacles.push({el,y:-50,isHitTarget:isHit,isPowerUp:isPU,power:el.dataset.power,x:obsX,isMoving,moveDir,moveSpeed});
}
function gameLoop(ts){
if(!state.isPlaying||state.isPaused)return;if(!state.lastTime)state.lastTime=ts;const dt=Math.min(ts-state.lastTime,100);state.lastTime=ts;if(state.slowTimer>0)state.slowTimer-=dt;if(state.magnetTimer>0)state.magnetTimer-=dt;if(state.magnetTimer<=0&&player.classList.contains('magnetized'))player.classList.remove('magnetized');updatePowerupUI();
let sp=state.gameSpeed;if(state.slowTimer>0)sp=state.gameSpeed*.5;state.playerX+=(state.targetX-state.playerX)*.15;player.style.left=state.playerX+'px';

// 🟢 محاسبه تعداد موانع: از لول ۴ به بعد دو برابر میشن (فاصله نصف میشه)
const currentLvlNum = Math.floor(state.score / 1000) + 1;
let spawnRate = 1000; // فاصله پایه
if (currentLvlNum >= 4) {
    spawnRate = 500; // از لول ۴ به بعد، فاصله ۵۰۰ میشه (دو برابر)
}
const si = spawnRate;
state.spawnTimer+=dt;if(state.spawnTimer>si){spawnObstacle();state.spawnTimer=0}

const pH=15, pL=state.playerX-pH, pR=state.playerX+pH;const pT=gameArea.clientHeight*0.90 - 15, pB=gameArea.clientHeight*0.90 + 15;
for(let i=state.obstacles.length-1;i>=0;i--){let o=state.obstacles[i];o.y+=sp;
if(o.isMoving){o.x+=o.moveDir*o.moveSpeed;const w=o.el.offsetWidth;if(o.x+w>=gameArea.clientWidth){o.x=gameArea.clientWidth-w;o.moveDir=-1}if(o.x<=0){o.x=0;o.moveDir=1}o.el.style.left=o.x+'px';}
if(state.magnetTimer>0&&o.isHitTarget){const oc=o.x+o.el.offsetWidth/2;o.x+=(state.playerX-oc)*.05;o.el.style.left=o.x+'px';}
o.el.style.top=o.y+'px';const ow=o.el.offsetWidth, oh=o.el.offsetHeight;const oL=o.x, oR=o.x+ow, oT=o.y, oB=o.y+oh;
if(pL<oR && pR>oL && pT<oB && pB>oT){o.el.remove();state.obstacles.splice(i,1);if(o.isPowerUp)activatePowerUp(o.power);else if(o.isHitTarget){state.score+=1;scoreEl.textContent=state.score;playSound('hit')}else{if(state.shields > 0){state.shields--;if(state.shields === 0) player.classList.remove('shielded');showToast(langData[state.lang].shieldBroken);playSound('power');}else{gameOver(); return;}}continue;}
if(o.y>gameArea.clientHeight){if(o.isHitTarget){if(state.shields > 0){state.shields--;if(state.shields === 0) player.classList.remove('shielded');showToast(langData[state.lang].shieldBroken);playSound('bad');}else{gameOver(); return;}}o.el.remove();state.obstacles.splice(i,1);}}
state.animationId=requestAnimationFrame(gameLoop);
}
function activatePowerUp(t){
playSound('power');const L=langData[state.lang];if(t==='🛡'){state.shields++;player.classList.add('shielded');showToast(L.shieldActive + ' (' + state.shields + ')');}else if(t==='🐢'){state.slowTimer=5000;showToast(L.slowActive)}else if(t==='✨'){state.magnetTimer=10000;player.classList.add('magnetized');showToast(L.magnetActive)}else if(t==='💥'){showToast(L.bomb);for(let i=state.obstacles.length-1;i>=0;i--){if(!state.obstacles[i].isHitTarget&&!state.obstacles[i].isPowerUp){state.obstacles[i].el.remove();state.obstacles.splice(i,1);}}}}
const touchZone=document.getElementById('touch-zone');
function handleMove(cx){if(!state.isPlaying||state.isPaused||!state.isTouching)return;const d=cx-state.touchStartX;state.targetX-=d*1.5;state.targetX=Math.max(20,Math.min(gameArea.clientWidth-20,state.targetX));state.touchStartX=cx;}
touchZone.addEventListener('touchstart',e=>{e.preventDefault();state.isTouching=true;state.touchStartX=e.touches[0].clientX},{passive:false});
touchZone.addEventListener('touchmove',e=>{e.preventDefault();handleMove(e.touches[0].clientX)},{passive:false});
touchZone.addEventListener('touchend',()=>state.isTouching=false);
touchZone.addEventListener('mousedown',e=>{state.isTouching=true;state.touchStartX=e.clientX});
window.addEventListener('mousemove',e=>handleMove(e.clientX));
window.addEventListener('mouseup',()=>state.isTouching=false);
function updateStage(){
if(!state.isPlaying) return;let currentStage = Math.floor(state.score / 100) + 1;let currentLvl = Math.floor((currentStage - 1) / 10) + 1;let displayStage = ((currentStage - 1) % 10) + 1;
if(currentLvl > state.currentLevelNum) {state.isPlaying = false;cancelAnimationFrame(state.animationId);clearInterval(state.scoreInterval);playSound('power');if (currentLvl > state.maxLevel) {state.maxLevel = currentLvl;localStorage.setItem('mirrorPath_maxLevel', state.maxLevel);}winScreen.classList.remove('hidden');homeBtn.classList.remove('show');pauseBtn.classList.remove('show');soundBtn.classList.remove('show');return;}
if(currentStage !== state.level + 1) {state.level = currentStage - 1;if(displayStage === 1) gameArea.style.backgroundColor = `hsl(${Math.random() * 360}, 30%, 15%)`;const L = langData[state.lang];stageDisplay.textContent = `${L.lvl} ${currentLvl} | ${L.stage} ${displayStage}`;}
let currentSpeedLevel = Math.floor(state.score / 200);if(currentSpeedLevel > state.speedLevel) {state.speedLevel = currentSpeedLevel;state.gameSpeed = 4.5 + (state.speedLevel * 0.3);}
}
function startScoreTimer(){clearInterval(state.scoreInterval);state.scoreInterval=setInterval(()=>{if(state.isPlaying&&!state.isPaused){state.score+=1;scoreEl.textContent=state.score;updateStage();}},66);}
function startGame(startLvl){
state.obstacles.forEach(o=>o.el.remove());state.obstacles=[];state.score = (startLvl - 1) * 1000;state.level = (startLvl - 1) * 10;state.speedLevel = Math.floor(state.score / 200);state.gameSpeed = 4.5 + (state.speedLevel * 0.3);state.shields = 0;state.currentLevelNum = startLvl;state.magnetTimer=0;state.slowTimer=0;state.playerX=gameArea.clientWidth/2;state.targetX=state.playerX;state.isPlaying=true;state.isPaused=false;state.lastTime=0;state.spawnTimer=0;
scoreEl.textContent=state.score;stageDisplay.textContent = langData[state.lang].lvl + ' ' + startLvl + ' | ' + langData[state.lang].stage + ' 1';player.style.left=state.playerX+'px';player.classList.remove('shielded','magnetized');levelOverlay.classList.remove('show');startScreen.classList.add('hidden');endScreen.classList.add('hidden');winScreen.classList.add('hidden');levelsScreen.classList.add('hidden');pauseBtn.classList.add('show');soundBtn.classList.add('show');homeBtn.classList.add('show');pauseBtn.textContent='⏸';startScoreTimer();state.animationId=requestAnimationFrame(gameLoop);
}
function gameOver(){
state.isPlaying=false;cancelAnimationFrame(state.animationId);clearInterval(state.scoreInterval);playSound('bad');if(state.score>state.bestScore){state.bestScore=state.score;localStorage.setItem('mirrorPath_bestScore',state.bestScore);document.getElementById('best-score').textContent=state.bestScore;showToast(langData[state.lang].newRecord);}
document.getElementById('final-score').textContent=state.score;homeBtn.classList.remove('show');pauseBtn.classList.remove('show');soundBtn.classList.remove('show');let currentLvl = Math.floor(state.score / 1000) + 1;if(currentLvl >= 2) document.getElementById('lose-btn-lvl2').style.display = 'block';else document.getElementById('lose-btn-lvl2').style.display = 'none';setTimeout(()=>endScreen.classList.remove('hidden'),300);
}
function togglePause(){if(!state.isPlaying)return;state.isPaused=!state.isPaused;pauseBtn.textContent=state.isPaused?'▶':'⏸';if(state.isPaused)cancelAnimationFrame(state.animationId);else{state.lastTime=performance.now();state.animationId=requestAnimationFrame(gameLoop)}}
function toggleSound(){state.soundOn=!state.soundOn;soundBtn.textContent=state.soundOn?'🔊':'🔇'}
document.getElementById('best-score').textContent=state.bestScore;
setLang('fa');
</script>
</body>
</html>
